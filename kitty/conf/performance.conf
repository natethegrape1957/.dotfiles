#: Performance tuning {{{

repaint_delay 10
#: Delay between each frame

input_delay 3
#: Note that decreasing it will increase responsiveness, but also increase
#: CPU usage and might cause flicker in full screen programs that redraw
#: the entire screen on each loop, because kitty is so fast that partial
#: screen updates will be drawn. This setting is ignored when the input
#: buffer is almost full.

sync_to_monitor yes
#: Sync screen updates to the refresh rate of the monitor. This
#: prevents screen tearing
#: <https://en.wikipedia.org/wiki/Screen_tearing> when scrolling.
#: However, it limits the rendering speed to the refresh rate of your
#: monitor. With a very high speed mouse/high keyboard repeat rate,
#: you may notice some slight input latency. If so, set this to no.
